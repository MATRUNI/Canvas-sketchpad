<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch Pad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hidden" id="mode-container">
        <span>MODE:</span>
        <span id="mode"></span>
    </div>
    <div id="container">
        <input type="color" name="pick" id="colorpick" placeholder="color" value="#ffffff">
        <input type="color" name="pick" id="colorpick1" placeholder="color" value="#000000">
        <input type="range" name="range" id="size" placeholder="range" min="1" max="100" value="5">
        <input type="number" min="1" max="100" placeholder="range" id="size-value" value="5">

        <div class="zoom-toggle">
            <button class="zoom-option active" data-mode="mouse">MOUSE</button>
            <button class="zoom-option" data-mode="center">CENTER</button>
            <div class="zoom-slider"></div>
        </div>
        <button id="clear-btn">clear</button>
    </div>
    <div id="undo-container">
        <button id="undo" class="undo-btn" title="Undo">↶</button>
        <button id="redo" class="undo-btn" title="Redo">↷</button>
    </div>
    <canvas id="canvas"></canvas>
    <script type="module" src="./logic.js"></script>
    <script>
        let slider=document.getElementById("size");
        let sliderVal=document.getElementById("size-value");

        slider.addEventListener("input",()=>{
            sliderVal.value=slider.value;
        });
        sliderVal.addEventListener("input",()=>{
            let val=parseInt(sliderVal.value);
            if (isNaN(val)) val = 1;
            if (val < 1) val = 1;
            if (val > 100) val = 100;
            slider.value = val;
            sliderVal.value = val;
        });
    </script>
</body>
</html>
